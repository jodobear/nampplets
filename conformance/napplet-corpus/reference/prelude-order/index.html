<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prelude order reference</title>
  <script>
    globalThis.__preludeAtFirstScript = {
      nappletPresent: typeof window.napplet === "object",
      nostrAbsent: typeof window.nostr === "undefined"
    };
    window.parent.postMessage({
      type: "conformance.prelude-observed",
      ...globalThis.__preludeAtFirstScript
    }, "*");
  </script>
</head>
<body>Prelude order reference</body>
</html>
