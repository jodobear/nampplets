<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench Welcome Napplet</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 15% 10%, color-mix(in srgb, #ff9f0a 18%, transparent), transparent 38%),
        radial-gradient(circle at 85% 85%, color-mix(in srgb, #64d2ff 18%, transparent), transparent 42%),
        Canvas;
      color: CanvasText;
    }
    article {
      width: min(560px, 100%);
      padding: 30px;
      border: 1px solid color-mix(in srgb, CanvasText 13%, transparent);
      border-radius: 22px;
      background: color-mix(in srgb, Canvas 90%, transparent);
      box-shadow: 0 18px 50px color-mix(in srgb, #000 16%, transparent);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #ff9f0a;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.04em; }
    p { color: color-mix(in srgb, CanvasText 68%, transparent); line-height: 1.55; }
    #status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      background: color-mix(in srgb, #30d158 13%, transparent);
      color: #248a3d;
      font-size: 13px;
      font-weight: 650;
    }
    #status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
  </style>
</head>
<body>
  <article>
    <p class="eyebrow">Bundled compatibility fixture</p>
    <h1>A napplet is running.</h1>
    <p>
      This unchanged HTML artifact can see only the granted
      <code>window.napplet.shell</code> domain. Its ping crosses the sandbox,
      trusted shell, isolated native bridge, and returns here.
    </p>
    <div id="status" role="status">Contacting native runtime…</div>
  </article>
  <script>
    const status = document.getElementById("status");
    if (!window.napplet || !window.napplet.shell || window.nostr) {
      status.textContent = "Compatibility contract unavailable";
    } else {
      window.napplet.shell.ping({ fixture: "minimal-conformant" })
        .then((reply) => {
          status.textContent = reply && reply.ok
            ? "Native runtime replied — trust boundary intact"
            : "Unexpected native reply";
        })
        .catch(() => {
          status.textContent = "Native runtime request refused";
        });
    }
  </script>
</body>
</html>
