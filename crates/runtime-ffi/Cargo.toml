[package]
name = "nmp-native-runtime-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "lib"]
name = "nmp_native_runtime_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
nmp.workspace = true
nmp-native-artifact = { path = "../artifact" }
nmp-native-nap-bridge = { path = "../nap-bridge" }
nmp-native-nmp-adapter = { path = "../nmp-adapter" }
nmp-native-providers = { path = "../providers" }
nmp-native-runtime-app = { path = "../runtime-app" }
nmp-native-runtime-core = { path = "../runtime-core" }
nmp-native-runtime-store = { path = "../runtime-store" }
nmp-native-surface = { path = "../surface" }
parking_lot.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
