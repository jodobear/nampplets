    <meta name="napplet-type" content="nip29-groups">
    <meta name="napplet-requires" content="config,intent,relay">
    <meta name="napplet-config-schema" content="{&quot;type&quot;:&quot;object&quot;,&quot;properties&quot;:{&quot;relays&quot;:{&quot;type&quot;:&quot;array&quot;,&quot;items&quot;:{&quot;type&quot;:&quot;string&quot;},&quot;default&quot;:[&quot;wss://groups.0xchat.com&quot;],&quot;x-napplet-section&quot;:&quot;relays&quot;,&quot;x-napplet-order&quot;:1}}}">
  </head>
  <body>
    <main id="app" class="app">
      <header class="header">
        <h1 class="header-title">Groups</h1>
        <label class="search">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6" />
            <path d="M18 18l-4.5-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
          <input id="searchInput" type="text" placeholder="Search groups" autocomplete="off" />
        </label>
      </header>

      <div class="relay-bar">
        <div id="relayChips" class="relay-chips"></div>
        <button id="addRelayButton" type="button" class="add-relay-button" aria-label="Add relay" aria-expanded="false">+</button>
      </div>
      <div id="addRelayForm" class="add-relay-form" hidden>
        <input id="relayInput" type="text" placeholder="wss://relay.example.com" autocomplete="off" inputmode="url" />
        <button id="addRelaySubmit" type="button">Add</button>
      </div>

      <output id="status" class="status" aria-live="polite"></output>

      <section id="recentSection" class="section" hidden>
        <h2 class="section-title">Recent</h2>
        <ul id="recentList" class="group-list"></ul>
      </section>

      <section class="section">
        <h2 class="section-title">All groups</h2>
        <ul id="groupList" class="group-list"></ul>
        <p id="emptyState" class="empty-state" hidden>No groups found on the configured relays.</p>
      </section>
    </main>
  </body>
</html>
