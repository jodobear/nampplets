    <meta name="napplet-type" content="nip29-chat">
    <meta name="napplet-requires" content="identity,inc,relay">
  </head>
  <body>
    <main id="app" class="app">
      <header id="chatHeader" class="chat-header" hidden>
        <div class="avatar" id="headerAvatar">
          <img id="headerAvatarImg" alt="" hidden />
          <span id="headerAvatarFallback" class="avatar-fallback"></span>
        </div>
        <div class="chat-header-body">
          <p id="headerName" class="chat-header-name"></p>
          <p id="headerMeta" class="chat-header-meta"></p>
        </div>
      </header>

      <output id="status" class="status" aria-live="polite"></output>

      <section id="emptyState" class="empty-state">
        <p>Open a group from NIP-29 Groups to start chatting.</p>
      </section>

      <div id="messageList" class="message-list" hidden></div>

      <div id="mentionPopover" class="mention-popover" hidden></div>

      <div id="composer" class="composer" hidden>
        <button id="attachButton" class="attach-button" type="button" aria-label="Attach file">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path
              d="M13.5 6.5l-6 6a2.5 2.5 0 003.5 3.5l6-6a4.5 4.5 0 00-6.36-6.36l-6 6a6.5 6.5 0 009.19 9.19"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <input id="attachInput" type="file" hidden />
        <input id="messageInput" type="text" placeholder="Message" autocomplete="off" />
        <button id="sendButton" class="send-button" type="button" aria-label="Send message">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 10h13M11 4l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </main>
  </body>
</html>
